services:
  - type: web
    name: mango-classifier-api
    runtime: python
    plan: free
    buildCommand: pip install -r deploy/requirements.txt
    startCommand: python -m deploy.database && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 120 deploy.service:api
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: DATABASE_URL
        sync: false

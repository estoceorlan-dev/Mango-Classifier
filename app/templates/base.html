<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mango Field Guide{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead wrap">
    <a class="brand" href="{{ url_for('index') }}"><span class="fruit-mark" aria-hidden="true"></span>Mango Field Guide</a>
    <nav aria-label="Main navigation">
      {% for endpoint, label in [('index', 'Home'), ('mango_section', 'Varieties'), ('classify_mango', 'Identify')] %}
      <a href="{{ url_for(endpoint) }}" {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main id="main" class="wrap">{% block content %}{% endblock %}</main>
  <footer class="wrap"><span>Mango Field Guide</span><a href="{{ url_for('welcome') }}">How it works</a></footer>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>

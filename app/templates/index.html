{% extends "base.html" %}
{% from "_cards.html" import cards %}
{% block content %}
<section class="hero">
  <img class="hero-photo" src="{{ url_for('assets', filename='images/background.png') }}" alt="Rows of mango trees in an orchard at sunset" fetchpriority="high">
  <div class="hero-text">
    <h1>Know your<br><em>mango.</em></h1>
    <p>Identify a mango from a photo, or explore the traits that set each variety apart.</p>
    <a class="button gold" href="{{ url_for('classify_mango') }}">Identify a mango <span aria-hidden="true">↗</span></a>
  </div>
</section>
<section class="collection">
  <div class="heading-row"><h2>Featured varieties</h2><a class="text-link" href="{{ url_for('mango_section') }}">View all {{ variety_count }} <span aria-hidden="true">→</span></a></div>
  {{ cards(highlights) }}
</section>
{% endblock %}
